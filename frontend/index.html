<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LM960B 双模自组网 Demo</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Menlo', 'Consolas', monospace; font-size: 13px; height: 100vh; display: flex; flex-direction: column; }

  /* 顶部事件时间线 */
  #events {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 8px 16px;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 16px;
    overflow: hidden;
  }
  #events .ev-label { color: #8b949e; white-space: nowrap; }
  #events .ev-list { display: flex; gap: 12px; overflow: hidden; flex: 1; }
  .ev-item { white-space: nowrap; padding: 2px 8px; border-radius: 4px; background: #21262d; }
  .ev-item.join    { border-left: 3px solid #3fb950; }
  .ev-item.timeout { border-left: 3px solid #f85149; }
  .ev-item.recover { border-left: 3px solid #58a6ff; }
  .ev-item.mode    { border-left: 3px solid #d29922; }
  .ev-item.info    { border-left: 3px solid #8b949e; }

  /* 主体：左拓扑 + 右状态表 */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #topo {
    flex: 1;
    min-width: 0;
  }
  #sidebar {
    width: 380px;
    border-left: 1px solid #30363d;
    display: flex;
    flex-direction: column;
  }

  /* 状态表 */
  #node-table {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  #node-table h3 { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th { color: #8b949e; font-weight: normal; text-align: left; padding: 4px 8px; border-bottom: 1px solid #30363d; font-size: 11px; }
  td { padding: 6px 8px; border-bottom: 1px solid #21262d; }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px;
  }
  .badge-plc      { background: #1f4e2a; color: #3fb950; }
  .badge-wireless { background: #1a3a5c; color: #58a6ff; }
  .badge-dual     { background: #3d2e00; color: #d29922; }
  .badge-offline  { background: #2d1a1a; color: #f85149; }
  .badge-unknown  { background: #21262d; color: #8b949e; }

  /* 底部连接状态 */
  #footer {
    padding: 6px 12px;
    border-top: 1px solid #30363d;
    color: #8b949e;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #ws-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #f85149;
    transition: background 0.3s;
  }
  #ws-dot.connected { background: #3fb950; }
</style>
</head>
<body>

<!-- 顶部事件时间线 -->
<div id="events">
  <span class="ev-label">事件</span>
  <div class="ev-list" id="ev-list">
    <span class="ev-item info">等待连接...</span>
  </div>
</div>

<!-- 主体 -->
<div id="main">
  <div id="topo"></div>
  <div id="sidebar">
    <div id="node-table">
      <h3>节点状态</h3>
      <table>
        <thead>
          <tr>
            <th>MAC</th>
            <th>角色</th>
            <th>状态</th>
            <th>模式</th>
            <th>RTT</th>
          </tr>
        </thead>
        <tbody id="node-tbody"></tbody>
      </table>
    </div>
    <div id="footer">
      <div id="ws-dot"></div>
      <span id="ws-status">未连接</span>
    </div>
  </div>
</div>

<script>
// ── 状态 ──────────────────────────────────────────────────────────
const state = {
  masterMac: null,
  nodes: {},   // mac -> { mac, role, reachable, mode, band, rtt_ms, ts }
  events: [],  // 最新 5 条
};

// ── ECharts 拓扑图 ────────────────────────────────────────────────
const chart = echarts.init(document.getElementById('topo'));

function modeColor(mode, reachable) {
  if (!reachable) return '#6e7681';
  switch (mode) {
    case 'PLC':      return '#3fb950';
    case 'wireless': return '#58a6ff';
    case 'dual':     return '#d29922';
    default:         return '#8b949e';
  }
}

function buildTopoOption() {
  const nodes = [];
  const links = [];

  // 主节点
  const masterLabel = state.masterMac ? shortMac(state.masterMac) : 'Master';
  nodes.push({
    id: 'master',
    name: masterLabel,
    symbolSize: 48,
    itemStyle: { color: '#d29922' },
    label: { show: true, color: '#e6edf3', fontSize: 12 },
    x: 0, y: 0,
  });

  // 从节点
  const slaves = Object.values(state.nodes).filter(n => n.role === 'slave');
  const count = slaves.length;
  slaves.forEach((node, i) => {
    const angle = count === 1 ? -Math.PI / 2 : -Math.PI / 2 + (2 * Math.PI * i / count);
    const r = 160;
    const color = modeColor(node.mode, node.reachable);
    nodes.push({
      id: node.mac,
      name: shortMac(node.mac),
      symbolSize: 36,
      itemStyle: { color },
      label: { show: true, color: '#e6edf3', fontSize: 11 },
      x: Math.cos(angle) * r,
      y: Math.sin(angle) * r,
    });
    links.push({
      source: 'master',
      target: node.mac,
      lineStyle: {
        color: node.reachable ? color : '#30363d',
        width: node.reachable ? 2 : 1,
        type: node.reachable ? 'solid' : 'dashed',
      },
    });
  });

  return {
    backgroundColor: '#0d1117',
    series: [{
      type: 'graph',
      layout: 'none',
      roam: true,
      nodes,
      links,
      lineStyle: { curveness: 0 },
      emphasis: { focus: 'adjacency' },
      label: { position: 'bottom' },
    }],
  };
}

function refreshTopo() {
  chart.setOption(buildTopoOption(), { notMerge: true });
}

window.addEventListener('resize', () => chart.resize());

// ── 节点状态表 ────────────────────────────────────────────────────
function modeBadge(mode, reachable) {
  if (!reachable) return '<span class="badge badge-offline">离线</span>';
  const map = {
    PLC:      ['badge-plc',      'PLC有线'],
    wireless: ['badge-wireless', '无线'],
    dual:     ['badge-dual',     '双模'],
  };
  const [cls, label] = map[mode] || ['badge-unknown', mode || '-'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function shortMac(mac) {
  return mac ? mac.slice(-6) : '-';
}

function refreshTable() {
  const tbody = document.getElementById('node-tbody');
  const rows = Object.values(state.nodes).map(n => {
    const reachIcon = n.reachable ? '✓' : '✗';
    const reachColor = n.reachable ? '#3fb950' : '#f85149';
    const rtt = n.rtt_ms != null ? `${n.rtt_ms} ms` : '-';
    return `<tr>
      <td style="font-size:11px">${n.mac}</td>
      <td>${n.role === 'master' ? '主' : '从'}</td>
      <td style="color:${reachColor}">${reachIcon}</td>
      <td>${modeBadge(n.mode, n.reachable)}</td>
      <td>${rtt}</td>
    </tr>`;
  });
  tbody.innerHTML = rows.join('') || '<tr><td colspan="5" style="color:#8b949e;text-align:center">暂无节点</td></tr>';
}

// ── 事件时间线 ────────────────────────────────────────────────────
function addEvent(text, cls = 'info') {
  const now = new Date();
  const ts = now.toTimeString().slice(0, 8);
  state.events.unshift({ ts, text, cls });
  if (state.events.length > 5) state.events.pop();
  renderEvents();
}

function renderEvents() {
  const list = document.getElementById('ev-list');
  list.innerHTML = state.events.map(e =>
    `<span class="ev-item ${e.cls}">${e.ts} ${e.text}</span>`
  ).join('');
}

// ── WebSocket ─────────────────────────────────────────────────────
let ws = null;
let reconnectTimer = null;

function connect() {
  const url = `ws://${location.host}/ws`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    document.getElementById('ws-dot').classList.add('connected');
    document.getElementById('ws-status').textContent = '已连接';
    addEvent('WebSocket 已连接', 'info');
  };

  ws.onclose = () => {
    document.getElementById('ws-dot').classList.remove('connected');
    document.getElementById('ws-status').textContent = '已断开，重连中...';
    addEvent('连接断开', 'timeout');
    reconnectTimer = setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    ws.close();
  };

  ws.onmessage = (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch { return; }
    handleMessage(msg);
  };
}

function handleMessage(msg) {
  switch (msg.type) {

    case 'master_info': {
      state.masterMac = msg.mac;
      if (!state.nodes[msg.mac]) {
        state.nodes[msg.mac] = { mac: msg.mac, role: 'master', reachable: true, mode: 'dual', rtt_ms: null };
        addEvent(`主模组上线 ${shortMac(msg.mac)}`, 'join');
      }
      refreshTopo();
      refreshTable();
      break;
    }

    case 'node_status': {
      const mac = msg.mac;
      const prev = state.nodes[mac];
      const wasReachable = prev?.reachable;
      const prevMode = prev?.mode;

      state.nodes[mac] = {
        mac,
        role: 'slave',
        reachable: msg.reachable,
        mode: msg.mode || (prev?.mode ?? null),
        band: msg.band ?? (prev?.band ?? null),
        rtt_ms: msg.rtt_ms,
        ts: msg.ts,
      };

      // 生成事件
      if (!wasReachable && msg.reachable) {
        addEvent(`${shortMac(mac)} 恢复可达 (${msg.mode || '-'})`, 'recover');
      } else if (wasReachable && !msg.reachable) {
        addEvent(`${shortMac(mac)} 超时/离线`, 'timeout');
      } else if (prevMode && msg.mode && prevMode !== msg.mode) {
        addEvent(`${shortMac(mac)} 模式切换 ${prevMode}→${msg.mode}`, 'mode');
      }

      refreshTopo();
      refreshTable();
      break;
    }

    case 'slave_found':
    case 'node_join': {
      const mac = msg.mac;
      if (!state.nodes[mac]) {
        state.nodes[mac] = { mac, role: 'slave', reachable: true, mode: msg.mode || null, rtt_ms: null };
        addEvent(`${shortMac(mac)} 加入网络`, 'join');
        refreshTopo();
        refreshTable();
      }
      break;
    }
  }
}

// ── 启动 ──────────────────────────────────────────────────────────
refreshTopo();
refreshTable();
connect();
</script>
</body>
</html>
